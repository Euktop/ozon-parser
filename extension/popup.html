<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ozon Parser</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
      width: 400px; margin: 0; padding: 0;
      color: #222; background: #fff;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid #eee;
      background: #fafafa;
    }
    header h1 { font-size: 15px; margin: 0; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      background: #005bff; color: #fff; font-size: 11px; font-weight: 600;
      margin-left: 6px;
    }
    .actions {
      display: flex; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid #eee; flex-wrap: wrap;
    }
    button {
      padding: 5px 10px; font: inherit; cursor: pointer;
      border: 1px solid #ccc; background: #fff; border-radius: 4px;
    }
    button:hover:not(:disabled) { background: #f0f0f0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: #005bff; color: #fff; border-color: #005bff; }
    button.primary:hover:not(:disabled) { background: #0049cc; }
    button.danger { color: #c00; border-color: #fcc; }
    button.danger:hover:not(:disabled) { background: #fff0f0; }
    #list {
      max-height: 380px; overflow-y: auto; padding: 4px 0;
    }
    .item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #f3f3f3;
    }
    .item:last-child { border-bottom: none; }
    .item-main { flex: 1; min-width: 0; }
    .item-title {
      font-weight: 500; margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-meta { color: #888; font-size: 11px; }
    .item-del {
      flex: 0 0 auto; padding: 2px 8px; font-size: 14px;
      line-height: 1; color: #c00; border: none; background: none;
      cursor: pointer;
    }
    .item-del:hover { background: #ffe0e0; border-radius: 3px; }
    .empty, .error {
      padding: 24px 12px; text-align: center; color: #888;
    }
    .error { color: #c00; }
    #status {
      padding: 6px 12px; font-size: 11px; color: #666;
      border-top: 1px solid #eee; min-height: 26px;
    }
    #status.error { color: #c00; }
  </style>
</head>
<body>
  <header>
    <h1>Ozon Parser <span class="badge" id="count">0</span></h1>
    <button id="ingest" class="primary" title="Alt+Shift+O">Ingest текущей</button>
  </header>

  <div class="actions">
    <button id="refresh">Обновить</button>
    <button id="ingest-all" title="Ingest всех открытых PDP-вкладок">Все вкладки</button>
    <button id="download-md">MD</button>
    <button id="download-jsonl">JSONL</button>
    <button id="download-csv">CSV</button>
    <button id="clear" class="danger">Очистить всё</button>
    <button id="settings" title="Настройки (токен, auto-ingest)" style="margin-left: auto; font-size: 15px;">⚙</button>
  </div>

  <div id="list"></div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
